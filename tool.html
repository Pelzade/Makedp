<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MakeDP – Profile Picture Composer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <a href="index.html">
          <img src="makedp.png" alt="MakeDP Logo" class="nav-logo-img" />
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#how-it-works">How It Works</a></li>
        <li><a href="tool.html" class="nav-cta active">Use MakeDP now →</a></li>
      </ul>
      <div class="nav-toggle" id="navToggle">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <!-- Ad Top (optional) -->
  <div class="tool-ad-top">
    <!-- Ad code here -->
  </div>

  <!-- Main composer -->
  <div class="container">
    <h2 style="margin-top: 0; margin-bottom: 20px; font-weight: 500; font-size: 1.6rem;">Branded Profile</h2>

    <div class="controls">
      <div class="field">
        <label for="overlayInput">Upload Frame (PNG Only)</label>
        <input type="file" id="overlayInput" accept="image/png" />
      </div>
      <div class="field">
        <label for="dpInput">Upload Your Display Picture (JPG, PNG, etc.)</label>
        <input type="file" id="dpInput" accept="image/*" />
      </div>
      <div class="field slider-field">
        <label for="scaleSlider">Scale DP</label>
        <input type="range" id="scaleSlider" min="0.5" max="2" step="0.01" value="1" />
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="1000" height="1000"></canvas>
    </div>

    <div class="actions">
      <button id="downloadBtn">Download</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer" style="margin-top: 40px;">
    <div class="footer-container">
      <div class="footer-brand">
        <img src="makedp2.png" alt="MakeDP Logo" style="height: 32px; width: auto; display: inline-block; margin-bottom: 8px;" />
        <p style="margin-top: 4px;">Free profile picture composer for everyone.</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="index.html#how-it-works">How It Works</a>
        <a href="tool.html">Get Started</a>
      </div>
      <div class="footer-ads">
  <a href="https://temu.to/k/eyn0vnyoa7x" target="_blank" rel="noopener" style="display:block; width:100%;">
    <img src="https://your-banner-image.jpg" alt="Advertisement" style="width:100%; max-width:100%; height:auto; display:block; border-radius:8px;" />
  </a>
</div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 MakeDP. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
